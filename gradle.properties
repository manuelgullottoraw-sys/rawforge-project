org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
compose.desktop.verbose=true

# NB (errore CI reale, solo sul runner Windows): repo.maven.apache.org (Maven
# Central, dietro Fastly) ha risposto "403 Forbidden" a 3 richieste POM durante
# la risoluzione di :desktopApp:runtimeClasspath — un task con MOLTE più
# richieste HTTP sequenziali del semplice compileClasspath (che infatti nella
# stessa run era andato a buon fine). Causa nota e documentata: il client HTTP
# di Gradle su Windows riusa connessioni keep-alive, e Fastly a volte inizia a
# rifiutare (403, non 404/5xx) le richieste successive sulla STESSA connessione
# riusata dopo un certo numero di richieste. La correzione standard è forzare
# una connessione nuova per ogni richiesta, disabilitando il keep-alive HTTP.
systemProp.http.keepAlive=false
systemProp.https.keepAlive=false
